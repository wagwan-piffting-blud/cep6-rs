[package]
name = "ceps-gui"
version = "1.0.0"
edition = "2021"
description = "Ceps: a desktop reader for Cepstral Swift 6.2 voices"

[[bin]]
name = "ceps-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ceps = { path = "..", default-features = false }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
